name: CI

# Each change is tested once, on its pull request. The weekly run surfaces drift
# in the registry.
on:
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # 20.x is the lowest version package.json promises. 22.x is what publish.yml
    # validates and releases on.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The ratchet's first pass lints the same files as npm run lint, and the
      # config reports unused directives.
      - name: Lint and check the lint ratchet
        env:
          LINT_RATCHET_BASE: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: npm run lint:ratchet -- --base-ref "$LINT_RATCHET_BASE"

      - name: Format check
        run: npm run format:check

      - name: Type check (sources and tests)
        run: npm run typecheck

      - name: Run tests
        run: env -u DISPLAY -u WAYLAND_DISPLAY npm test -- --maxWorkers=4

      - name: Build
        run: npm run build

      - name: Build the browser example without Node polyfills
        run: npm ci && npm run build
        working-directory: example

      - name: Bundle size check
        run: npm run size

      # Last, so a failing audit can never skip the checks above.
      - name: Audit production dependencies
        run: node scripts/audit-gate.mjs

      # publish.yml runs the full audit (dev tooling included) and refuses to
      # publish on a high advisory. Warn here first so it never surprises a release.
      - name: Full audit, warning only
        run: npm audit --audit-level=high || echo "::warning::npm audit reports a high advisory in the full tree; publish.yml will refuse to publish until it is fixed"

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install SDK dependencies
        run: npm ci

      - name: Build the SDK (ui type-checks against its dist)
        run: npm run build

      - name: Install ui dependencies
        run: npm ci --prefix ui

      - name: Lint and check the lint ratchet
        env:
          LINT_RATCHET_BASE: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: npm run lint:ratchet -- --base-ref "$LINT_RATCHET_BASE"
        working-directory: ui

      - name: Format check
        run: npm run format:check
        working-directory: ui

      - name: Type check (sources and tests)
        run: npm run typecheck
        working-directory: ui

      - name: Run tests
        run: env -u DISPLAY -u WAYLAND_DISPLAY npm test -- --maxWorkers=4
        working-directory: ui

      - name: Build
        run: npm run build
        working-directory: ui

      # Last, so a failing audit can never skip the checks above.
      - name: Audit SDK production dependencies
        run: node scripts/audit-gate.mjs

      - name: Audit UI production dependencies
        run: node scripts/audit-gate.mjs --dir ui

      - name: UI full audit, warning only
        run: npm audit --audit-level=high || echo "::warning::npm audit reports a high advisory in the ui tree; publish.yml will refuse to publish until it is fixed"
        working-directory: ui
