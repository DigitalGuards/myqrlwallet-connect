name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: node scripts/audit-gate.mjs

      # publish.yml runs the full audit (dev tooling included) and refuses to
      # publish on a high advisory. Warn here first so it never surprises a release.
      - name: Full audit, warning only
        run: npm audit --audit-level=high || echo "::warning::npm audit reports a high advisory in the full tree; publish.yml will refuse to publish until it is fixed"

      - name: Lint
        run: npm run lint

      - name: Check lint ratchet
        env:
          LINT_RATCHET_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run lint:ratchet -- --base-ref "$LINT_RATCHET_BASE"

      - name: Format check
        run: npm run format:check

      - name: Type check (sources and tests)
        run: npm run typecheck

      - name: Run tests
        run: env -u DISPLAY -u WAYLAND_DISPLAY npm test -- --maxWorkers=4

      - name: Build
        run: npm run build

      - name: Build the browser example without Node polyfills
        run: npm ci && npm run build
        working-directory: example

      - name: Bundle size check
        run: npm run size

  ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install SDK dependencies
        run: npm ci

      - name: Audit SDK production dependencies
        run: node scripts/audit-gate.mjs

      - name: Build the SDK (ui type-checks against its dist)
        run: npm run build

      - name: Install ui dependencies
        run: npm ci --prefix ui

      - name: Audit UI production dependencies
        run: node scripts/audit-gate.mjs --dir ui

      - name: UI full audit, warning only
        run: npm audit --audit-level=high || echo "::warning::npm audit reports a high advisory in the ui tree; publish.yml will refuse to publish until it is fixed"
        working-directory: ui

      - name: Lint
        run: npm run lint
        working-directory: ui

      - name: Check lint ratchet
        env:
          LINT_RATCHET_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run lint:ratchet -- --base-ref "$LINT_RATCHET_BASE"
        working-directory: ui

      - name: Format check
        run: npm run format:check
        working-directory: ui

      - name: Type check (sources and tests)
        run: npm run typecheck
        working-directory: ui

      - name: Run tests
        run: env -u DISPLAY -u WAYLAND_DISPLAY npm test -- --maxWorkers=4
        working-directory: ui

      - name: Build
        run: npm run build
        working-directory: ui
